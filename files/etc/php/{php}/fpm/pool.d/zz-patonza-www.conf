; Neutralizes Ubuntu's default "www" pool (www.conf), which runs as www-data: www-data is in every app's group.
; php-fpm merges sections with the same name, and this file is read after www.conf.
; The pool is kept because php-fpm doesn't start without at least one pool.
[www]
user = nobody
group = nogroup
listen.owner = root
listen.group = root
listen.mode = 0600
pm = ondemand

upstream backend_php_{{appname}} {
  server unix:/var/run/phpfpm-{{appname}}.sock;
}

server {
  listen 0.0.0.0:80;
  listen 0.0.0.0:443 ssl;
  http2 on;

  ssl_certificate /etc/ssl/certs/ssl-cert-snakeoil.pem;
  ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;
  #ssl_certificate /home/{{appname}}/https/fullchain.pem;
  #ssl_certificate_key /home/{{appname}}/https/private.pem;

  root /home/{{appname}}/public_html;

  server_name {{domains}};

  location ^~ /accel/ {
    internal;
    alias /home/{{appname}}/public_html/;
  }
  
  location / {
    index index.php index.html;
    try_files $uri $uri/ $uri/index.php$is_args$args /index.php$is_args$args;
  }

  location ~ ^(?<script_name>.+?\.php)(?<path_info>/.*)?$ {
    fastcgi_split_path_info ^(.+?\.php)(.*)$;
    try_files $uri $fastcgi_script_name $uri/ $uri/index.php$is_args$args /index.php$is_args$args 404;
    include /etc/nginx/phpfpm.inc;
    fastcgi_pass backend_php_{{appname}};
  }
  
}

[{{appname}}]

listen = /var/run/phpfpm-{{appname}}.sock
listen.owner = {{appname}}-www
listen.group = www-data
listen.mode = 0660

user = {{appname}}-www
group = {{appname}}

pm = ondemand
pm.process_idle_timeout = 10
pm.max_children = 10

php_value[session.save_handler] = files
php_value[session.save_path] = /home/{{appname}}/session
php_value[upload_tmp_dir] = /home/{{appname}}/upload
php_value[sys_temp_dir] = /home/{{appname}}/tmp
